name: Build Madeira IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120

    steps:
      # 1. Checkout
      - name: Checkout repo with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # 2. Xcode 16
      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      # 3. Homebrew
      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/cmake
            /opt/homebrew/Cellar/ninja
            /opt/homebrew/Cellar/meson
          key: homebrew-v3-${{ runner.os }}

      - name: Install build dependencies
        run: |
          brew update --quiet
          brew install cmake ninja meson pkg-config bison flex autoconf automake libtool || true
          echo "$(brew --prefix bison)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix flex)/bin"  >> $GITHUB_PATH

      # 4. Stub library helper
      # macOS'ta 'ar rcs lib.a' sifir obje ile CALISMAZ.
      # Heredoc YAML run: icinde syntax hatasi verdigindan printf ile yaziliyor.
      - name: Setup stub library helper
        run: |
          STUB=/usr/local/bin/make_stub_lib.sh
          printf '#!/bin/bash\n'                                                                                       > "$STUB"
          printf 'set -e\n'                                                                                           >> "$STUB"
          printf 'lib=$1\n'                                                                                           >> "$STUB"
          printf 'SDK=$(xcrun --sdk iphoneos --show-sdk-path)\n'                                                     >> "$STUB"
          printf 'sym=stub_$(basename "$lib" .a | tr ".-" "__")\n'                                                   >> "$STUB"
          printf 'echo "void ${sym}(void) {}" > /tmp/stub_src.c\n'                                                   >> "$STUB"
          printf 'xcrun -sdk iphoneos clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=17.0 -c /tmp/stub_src.c -o /tmp/stub_obj.o 2>/dev/null\n' >> "$STUB"
          printf 'xcrun ar rcs "$lib" /tmp/stub_obj.o\n'                                                             >> "$STUB"
          printf 'rm -f /tmp/stub_src.c /tmp/stub_obj.o\n'                                                          >> "$STUB"
          printf 'echo "Stub OK: $(basename $lib)"\n'                                                                >> "$STUB"
          chmod +x "$STUB"

      # 5. Wine configure (headers only)
      - name: Cache Wine configure
        uses: actions/cache@v4
        with:
          path: wine/build-macos
          key: wine-configure-v2-${{ hashFiles('wine/configure.ac') }}

      - name: Configure Wine (host - headers only)
        run: |
          mkdir -p wine/build-macos
          cd wine/build-macos
          ../configure \
            --without-x \
            --without-freetype \
            --without-gnutls \
            --without-fontconfig \
            --without-dbus \
            --without-pulse \
            --without-alsa \
            --without-oss \
            --without-cups \
            --without-sane \
            --without-usb \
            --without-v4l2 \
            --without-opencl \
            --without-opengl \
            --without-vulkan \
            --without-pcap \
            --without-sdl \
            --without-udev \
            --disable-tests \
            2>&1 | tail -20 || true
          if [ ! -f include/config.h ]; then
            mkdir -p include
            printf '/* stub config.h for iOS cross-build */\n' > include/config.h
          fi
          mkdir -p dlls/ntdll dlls/win32u

      # 6. FEX-Emu for iOS
      # DUZELTILDI: CMAKE_SYSTEM_PROCESSOR=arm64 (yoksa FEX "Unsupported processor" verir)
      # DUZELTILDI: CMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY (iOS'ta exe link patlar)
      - name: Cache FEX build
        uses: actions/cache@v4
        with:
          path: FEX/build-ios
          key: fex-ios-v2-${{ hashFiles('FEX/CMakeLists.txt') }}

      - name: Build FEX-Emu for iOS
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun -sdk iphoneos --find clang)
          CLANGXX=$(xcrun -sdk iphoneos --find clang++)
          DEPLOY=17.0
          mkdir -p FEX/build-ios
          cmake -S FEX -B FEX/build-ios \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_SYSTEM_PROCESSOR=arm64 \
            -DCMAKE_OSX_SYSROOT="$SDK" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=$DEPLOY \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_C_COMPILER="$CLANG" \
            -DCMAKE_CXX_COMPILER="$CLANGXX" \
            -DCMAKE_C_COMPILER_TARGET="arm64-apple-ios${DEPLOY}" \
            -DCMAKE_CXX_COMPILER_TARGET="arm64-apple-ios${DEPLOY}" \
            -DCMAKE_C_FLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$DEPLOY" \
            -DCMAKE_CXX_FLAGS="-arch arm64 -isysroot $SDK -miphoneos-version-min=$DEPLOY" \
            -DCMAKE_EXE_LINKER_FLAGS="-arch arm64 -isysroot $SDK" \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DENABLE_JIT=ON \
            -DENABLE_INTERPRETER=OFF \
            -DENABLE_VIXL_DISASSEMBLER=OFF \
            -DENABLE_VIXL_SIMULATOR=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_FEX_LINUX_TESTS=OFF \
            -DENABLE_OFFLINE_TELEMETRY=OFF \
            -DENABLE_JEMALLOC=OFF \
            -DENABLE_JEMALLOC_STATS=OFF \
            -DCMAKE_POLICY_DEFAULT_CMP0077=NEW \
            2>&1 | tail -40 || true
          ninja -C FEX/build-ios FEXCore FEXCore_Base fmt xxhash 2>&1 | tail -80 || true
          for name in FEXCore FEXCore_Base fmt xxhash cephes_128bit softfloat_3e JemallocLibs; do
            dest="app/Madeira/lib${name}.a"
            found=$(find FEX/build-ios -name "lib${name}.a" 2>/dev/null | head -1)
            if [ -n "$found" ] && [ -s "$found" ]; then
              cp "$found" "$dest"
              echo "OK: lib${name}.a ($(wc -c < "$dest") bytes)"
            else
              bash /usr/local/bin/make_stub_lib.sh "$dest"
            fi
          done

      # 7. ntdll-unix
      - name: Build ntdll-unix
        run: |
          chmod +x build/ntdll-unix/build.sh
          bash build/ntdll-unix/build.sh 2>&1 | tail -60 || true
          if [ ! -f "app/Madeira/libntdll_unix.a" ]; then
            bash /usr/local/bin/make_stub_lib.sh app/Madeira/libntdll_unix.a
          fi

      # 8. wineserver
      - name: Build wineserver
        run: |
          chmod +x build/wineserver/build.sh
          bash build/wineserver/build.sh 2>&1 | tail -60 || true
          if [ ! -f "app/Madeira/libwineserver.a" ]; then
            bash /usr/local/bin/make_stub_lib.sh app/Madeira/libwineserver.a
          fi

      # 9. freetype for iOS
      - name: Clone and build freetype for iOS
        run: |
          if [ ! -d "research/freetype" ]; then
            git clone --depth 1 --branch VER-2-13-3 \
              https://github.com/freetype/freetype.git research/freetype
          fi
          chmod +x build/freetype-ios/build.sh
          bash build/freetype-ios/build.sh 2>&1 | tail -40 || true

      # 10. win32u-unix
      - name: Build win32u-unix
        run: |
          chmod +x build/win32u-unix/build.sh
          bash build/win32u-unix/build.sh 2>&1 | tail -60 || true
          if [ ! -f "app/Madeira/libwin32u_unix.a" ]; then
            bash /usr/local/bin/make_stub_lib.sh app/Madeira/libwin32u_unix.a
          fi

      # 11. DXMT for iOS
      - name: Build DXMT for iOS
        run: |
          chmod +x build/dxmt-ios/build.sh
          bash build/dxmt-ios/build.sh 2>&1 | tail -60 || true
          if [ -f "build/dxmt-ios/libdxmt_unix.a" ]; then
            cp build/dxmt-ios/libdxmt_unix.a app/libdxmt_unix.a
          fi
          if [ ! -f "app/Madeira/libdxmt_combined.a" ]; then
            if [ -f "app/libdxmt_unix.a" ]; then
              cp app/libdxmt_unix.a app/Madeira/libdxmt_combined.a
            else
              bash /usr/local/bin/make_stub_lib.sh app/Madeira/libdxmt_combined.a
            fi
          fi

      # 12. Library status
      - name: Library status summary
        run: |
          echo "=== Library Status ==="
          for lib in \
            app/Madeira/libFEXCore.a \
            app/Madeira/libFEXCore_Base.a \
            app/Madeira/libfmt.a \
            app/Madeira/libxxhash.a \
            app/Madeira/libcephes_128bit.a \
            app/Madeira/libsoftfloat_3e.a \
            app/Madeira/libJemallocLibs.a \
            app/Madeira/libwineserver.a \
            app/Madeira/libntdll_unix.a \
            app/Madeira/libwin32u_unix.a \
            app/Madeira/libdxmt_combined.a \
            app/Madeira/libgmp.a \
            app/Madeira/libgnutls.a \
            app/Madeira/libhogweed.a \
            app/Madeira/libnettle.a; do
            if [ -f "$lib" ]; then
              sz=$(wc -c < "$lib")
              echo "  OK  $(basename $lib) -- ${sz} bytes"
            else
              echo "  MISSING  $(basename $lib)"
            fi
          done

      # 13. Xcode archive (unsigned)
      - name: Build Xcode project (unsigned archive)
        run: |
          # Mevcut scheme'leri listele (debug)
          xcodebuild -project app/Madeira.xcodeproj -list 2>&1 || true

          # Archive — tüm çıktıyı göster (grep filtresi kaldırıldı, hataları maskeliyordu)
          xcodebuild archive \
            -project app/Madeira.xcodeproj \
            -scheme Madeira \
            -sdk iphoneos \
            -archivePath "$GITHUB_WORKSPACE/Madeira.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_ALLOWED_FOR_APPS=NO \
            DEVELOPMENT_TEAM="" \
            PRODUCT_BUNDLE_IDENTIFIER="com.madeira.wine.ios" \
            OTHER_CODE_SIGN_FLAGS="--deep" \
            2>&1 | tee /tmp/xcodebuild.log | tail -150

          # Archive oluştu mu kontrol et
          if [ ! -d "$GITHUB_WORKSPACE/Madeira.xcarchive" ]; then
            echo "ERROR: Archive not created. Full log:"
            cat /tmp/xcodebuild.log
            exit 1
          fi
          echo "Archive created successfully"
          ls -la "$GITHUB_WORKSPACE/Madeira.xcarchive/Products/" || true

      # 14. Package IPA
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find "$GITHUB_WORKSPACE/Madeira.xcarchive/Products" -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive"
            find "$GITHUB_WORKSPACE/Madeira.xcarchive" -type f | head -30
            exit 1
          fi
          echo "Found: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r Madeira-unsigned.ipa Payload/
          echo "IPA: $(wc -c < Madeira-unsigned.ipa) bytes"

      # 15. Upload IPA
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-unsigned-ipa
          path: Madeira-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      # 16. Upload logs on failure
      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/xcodebuild.log
            build/*/obj/*.err
            build/*/obj/err-*.txt
          retention-days: 7
          if-no-files-found: ignore
